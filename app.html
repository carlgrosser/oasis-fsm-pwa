<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0066cc">
  <title>Oasis Field Service</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <h1>Oasis FSM</h1>
      <div class="header-actions">
        <span id="lunchTimer" class="lunch-timer" style="display:none;"></span>
        <button id="clockBtn" class="clock-btn state-out" style="display:none;">Clock On</button>
        <span id="syncBadge" class="sync-badge online">
          <span class="sync-dot"></span> Online
        </span>
        <span id="pendingBadge" class="pending-badge" style="display:none;">0</span>
        <div class="menu-wrapper">
          <button id="menuBtn" class="icon-btn" title="Menu">&#9776;</button>
          <div id="menuDropdown" class="menu-dropdown" style="display:none;">
            <button id="syncBtn" class="menu-item">&#10227; Sync Now</button>
            <button id="logoutBtn" class="menu-item menu-item-danger">&#9211; Log Out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Tab navigation -->
    <nav class="tab-bar">
      <button data-view="today" class="active">Today</button>
      <button data-view="week">This Week</button>
      <button data-view="history">History</button>
    </nav>

    <!-- Main content -->
    <main class="app-content">

      <!-- Job List View -->
      <div id="listView" class="view active">
        <div id="lastSync" class="pull-hint"></div>
        <div id="jobList" class="job-list">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Job Detail View -->
      <div id="detailView" class="view">
        <div id="jobDetail"></div>
      </div>

    </main>

  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/odoo-api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/timetracking.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
