<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0066cc">
  <title>Oasis Field Service</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">

    <!-- Header — Single bar -->
    <header class="app-header">
      <div class="app-header-top">
        <div class="header-actions">
          <span id="lunchTimer" class="lunch-timer" style="display:none;"></span>
          <button id="clockBtn" class="clock-btn state-out" style="display:none;">Clock On</button>
          <span id="syncBadge" class="sync-badge online">
            <span class="sync-dot"></span> Online
          </span>
          <span id="pendingBadge" class="pending-badge" style="display:none;">0</span>
        </div>
      </div>
    </header>

    <!-- Main content -->
    <main class="app-content">

      <!-- Job List Views (swipable) -->
      <div id="listView" class="view active">
        <div class="list-title-bar">
          <h2 id="listTitle" class="list-title">Today's Jobs</h2>
        </div>
        <div class="list-tabs" id="listTabs">
          <button class="list-tab active" data-view="today">Today</button>
          <button class="list-tab" data-view="week">This Week</button>
          <button class="list-tab" data-view="history">History</button>
        </div>
        <div class="list-panels" id="listPanels">
          <div class="list-panel" data-panel="today">
            <div id="lastSync" class="pull-hint"></div>
            <div id="jobListToday" class="job-list">
              <div class="loading"><div class="spinner"></div></div>
            </div>
          </div>
          <div class="list-panel" data-panel="week">
            <div id="jobListWeek" class="job-list">
              <div class="loading"><div class="spinner"></div></div>
            </div>
          </div>
          <div class="list-panel" data-panel="history">
            <div id="jobListHistory" class="job-list">
              <div class="loading"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Job Detail View -->
      <div id="detailView" class="view">
        <div id="jobDetail"></div>
      </div>

    </main>

    <!-- Footer Bar -->
    <footer class="app-footer" id="appFooter">
      <!-- List view footer (5 buttons, only menu active for now) -->
      <div class="footer-inner footer-list" id="footerList">
        <button class="footer-btn footer-btn-placeholder" disabled>
          <span class="footer-btn-icon">·</span>
        </button>
        <button class="footer-btn footer-btn-placeholder" disabled>
          <span class="footer-btn-icon">·</span>
        </button>
        <button class="footer-btn footer-btn-placeholder" disabled>
          <span class="footer-btn-icon">·</span>
        </button>
        <button class="footer-btn footer-btn-placeholder" disabled>
          <span class="footer-btn-icon">·</span>
        </button>
        <div class="footer-menu-wrapper">
          <button class="footer-btn footer-btn-menu" id="menuBtnList" title="Menu">
            <span class="footer-btn-icon">☰</span>
          </button>
          <div id="menuDropdownList" class="menu-dropdown menu-dropdown-up" style="display:none;" role="menu">
            <button id="themeBtnList" class="menu-item">🎨 Themes</button>
            <button id="noteBtnList" class="menu-item">📋 Note to Office</button>
            <button id="timeOffBtnList" class="menu-item">🗓️ My Time Off</button>
            <button id="syncBtnList" class="menu-item">&#10227; Sync Now</button>
            <button id="fixShiftBtnList" class="menu-item">⏱️ Adjust Shift</button>
            <button id="clearCacheBtnList" class="menu-item">🗑️ Clear Cache</button>
            <div class="menu-divider"></div>
            <button id="logoutBtnList" class="menu-item menu-item-danger">&#9211; Log Out</button>
          </div>
        </div>
      </div>
      <!-- Detail view footer (call, sms, placeholder, journal, menu) -->
      <div class="footer-inner footer-detail" id="footerDetail" style="display:none;">
        <button class="footer-btn footer-btn-call" id="footerCallBtn" title="Call">
          <span class="footer-btn-icon">📞</span>
        </button>
        <button class="footer-btn footer-btn-sms" id="footerSmsBtn" title="SMS">
          <span class="footer-btn-icon">💬</span>
        </button>
        <button class="footer-btn footer-btn-placeholder" disabled>
          <span class="footer-btn-icon">⭐</span>
        </button>
        <button class="footer-btn footer-btn-journal" id="footerJournalBtn" title="Journal">
          <span class="footer-btn-icon">📝</span>
        </button>
        <div class="footer-menu-wrapper">
          <button class="footer-btn footer-btn-menu" id="menuBtnDetail" title="Menu">
            <span class="footer-btn-icon">☰</span>
          </button>
          <div id="menuDropdownDetail" class="menu-dropdown menu-dropdown-up" style="display:none;" role="menu">
            <button id="themeBtnDetail" class="menu-item">🎨 Themes</button>
            <button id="noteBtnDetail" class="menu-item">📋 Note to Office</button>
            <button id="timeOffBtnDetail" class="menu-item">🗓️ My Time Off</button>
            <button id="syncBtnDetail" class="menu-item">&#10227; Sync Now</button>
            <button id="fixShiftBtnDetail" class="menu-item">⏱️ Adjust Shift</button>
            <button id="clearCacheBtnDetail" class="menu-item">🗑️ Clear Cache</button>
            <div class="menu-divider"></div>
            <button id="logoutBtnDetail" class="menu-item menu-item-danger">&#9211; Log Out</button>
          </div>
        </div>
        <!-- Contact picker popup -->
        <div id="contactPicker" class="contact-picker" style="display:none;"></div>
      </div>
    </footer>

  </div>

  <!-- Time Off Modal -->
  <div class="modal-overlay" id="timeOffModal" style="display:none;">
    <div class="modal modal-timeoff-worker">
      <div class="modal-header">
        <h3>My Time Off</h3>
        <button class="modal-close" id="timeOffClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="timeoff-worker-summary">
          <div class="timeoff-worker-stat">
            <div class="timeoff-worker-stat-value" id="timeOffPendingCount">--</div>
            <div class="timeoff-worker-stat-label">Pending</div>
          </div>
          <div class="timeoff-worker-stat">
            <div class="timeoff-worker-stat-value" id="timeOffUpcomingCount">--</div>
            <div class="timeoff-worker-stat-label">Upcoming</div>
          </div>
        </div>

        <div class="timeoff-worker-filters" id="timeOffFilters">
          <button class="timeoff-worker-filter active" data-filter="pending">Pending</button>
          <button class="timeoff-worker-filter" data-filter="approved">Approved</button>
          <button class="timeoff-worker-filter" data-filter="all">All</button>
          <button class="timeoff-worker-refresh" id="timeOffRefreshBtn" type="button">Refresh</button>
        </div>

        <div class="timeoff-worker-list" id="timeOffList">
          <div class="timeoff-worker-loading">Loading requests...</div>
        </div>

        <div class="divider"></div>

        <div class="timeoff-worker-form">
          <h4>Request Time Off</h4>
          <div class="form-group">
            <label for="timeOffLeaveType">Leave Type</label>
            <select class="form-input" id="timeOffLeaveType">
              <option value="">Loading...</option>
            </select>
          </div>
          <div class="timeoff-worker-dates">
            <div class="form-group">
              <label for="timeOffDateFrom" id="timeOffDateFromLabel">Date</label>
              <input type="date" class="form-input" id="timeOffDateFrom">
            </div>
            <div class="form-check timeoff-worker-multiday-check">
              <input type="checkbox" id="timeOffMultiDay">
              <label for="timeOffMultiDay">Multiple Days</label>
            </div>
            <div class="form-group" id="timeOffEndDateWrap" style="display:none;">
              <label for="timeOffDateTo">End Date</label>
              <input type="date" class="form-input" id="timeOffDateTo">
            </div>
          </div>
          <div class="form-group">
            <label for="timeOffNotes">Reason (optional)</label>
            <textarea class="form-input" id="timeOffNotes" rows="2" placeholder="Add a note for your manager"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="timeOffCancel">Close</button>
        <button class="btn btn-primary" id="timeOffSubmit">Submit Request</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/odoo-api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/timetracking.js"></script>
  <script src="js/timeoff.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
