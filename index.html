<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0066cc">
  <title>Oasis Field Service</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1>Oasis Field Service</h1>
        <p>Sign in to view your jobs</p>
      </div>

      <div id="loginError" class="alert alert-error" style="display:none;"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Your Odoo username"
                 autocomplete="username" autocapitalize="none" autocorrect="off" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Your password"
                 autocomplete="current-password" required>
        </div>
        <div class="form-check">
          <input type="checkbox" id="remember" checked>
          <label for="remember">Remember me</label>
        </div>
        <div style="margin-top: var(--spacing-md);">
          <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg">
            Sign In
          </button>
        </div>
      </form>

      <div id="loginStatus" style="text-align:center; margin-top:var(--spacing-md); display:none;">
        <div class="spinner" style="margin:0 auto;"></div>
        <p style="font-size:var(--font-size-small); color:var(--text-secondary); margin-top:var(--spacing-sm);">
          Connecting to server...
        </p>
      </div>

      <div id="installContainer" class="install-container" style="display:none;">
        <button type="button" id="installBtn" class="install-link">Install this app</button>
        <div id="installHelp" class="install-help" style="display:none;"></div>
      </div>
    </div>

    <p style="margin-top:var(--spacing-lg); font-size:var(--font-size-xs); color:var(--text-muted);">
      Oasis Pool Tile Cleaning & Christmas Lights
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/odoo-api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Init DB
      await DB.init();

      // Check for existing valid session
      const restored = await Auth.tryRestore();
      if (restored) {
        window.location.href = 'app.html';
        return;
      }

      // Bind login form
      const form = document.getElementById('loginForm');
      const errorEl = document.getElementById('loginError');
      const statusEl = document.getElementById('loginStatus');
      const loginBtn = document.getElementById('loginBtn');
      const installContainer = document.getElementById('installContainer');
      const installBtn = document.getElementById('installBtn');
      const installHelp = document.getElementById('installHelp');
      let deferredPrompt = null;

      const isStandalone = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      const isIOS = () => {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      };

      const showInstall = () => {
        if (!installContainer || isStandalone()) return;
        installContainer.style.display = 'block';
      };

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstall();
      });

      if (isIOS()) {
        showInstall();
      }

      installBtn.addEventListener('click', async () => {
        if (!installHelp) return;
        installHelp.style.display = 'none';
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          return;
        }
        installHelp.textContent = 'On iPhone: tap Share, then "Add to Home Screen".';
        installHelp.style.display = 'block';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.style.display = 'none';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;

        if (!username || !password) {
          errorEl.textContent = 'Please enter your username and password';
          errorEl.style.display = 'block';
          return;
        }

        // Show loading state
        loginBtn.style.display = 'none';
        statusEl.style.display = 'block';

        const result = await Auth.login(username, password, remember);

        if (result.success) {
          window.location.href = 'app.html';
        } else {
          errorEl.textContent = result.error;
          errorEl.style.display = 'block';
          loginBtn.style.display = 'flex';
          statusEl.style.display = 'none';
        }
      });
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('SW registration failed:', err);
      });
    }
  </script>
</body>
</html>
