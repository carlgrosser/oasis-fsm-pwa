<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0066cc">
  <title>Oasis Field Service</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1>Oasis Field Service</h1>
        <p>Sign in to view your jobs</p>
      </div>

      <div id="loginError" class="alert alert-error" style="display:none;"></div>

      <!-- Sign in with your phone: a code by text (no password to remember) -->
      <div id="codeLogin">
        <div class="form-group" id="phoneStep">
          <label for="loginPhone">Your mobile number</label>
          <input type="tel" id="loginPhone" class="form-input" placeholder="916 555 0123" autocomplete="tel" inputmode="tel">
          <button type="button" id="sendCodeBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--spacing-md);">Text me a code</button>
        </div>
        <div class="form-group" id="codeStep" style="display:none;">
          <label for="loginCode">The 6-digit code we texted <span id="codeTo"></span></label>
          <input type="text" id="loginCode" class="form-input" placeholder="123456" autocomplete="one-time-code"
                 inputmode="numeric" maxlength="6" style="font-size:24px;letter-spacing:6px;text-align:center;">
          <button type="button" id="codeSignInBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--spacing-md);">Sign In</button>
          <button type="button" id="resendCodeBtn" class="install-link" style="margin-top:var(--spacing-sm);">Send a new code</button>
        </div>
        <button type="button" id="usePasswordBtn" class="install-link" style="margin-top:var(--spacing-sm);">Use a username and password instead</button>
      </div>

      <form id="loginForm" autocomplete="on" style="display:none;">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Your Odoo username"
                 autocomplete="username" autocapitalize="none" autocorrect="off" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Your password"
                 autocomplete="current-password" required>
        </div>
        <div class="form-check">
          <input type="checkbox" id="remember" checked>
          <label for="remember">Remember me</label>
        </div>
        <div style="margin-top: var(--spacing-md);">
          <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg">
            Sign In
          </button>
        </div>
        <button type="button" id="useCodeBtn" class="install-link" style="margin-top:var(--spacing-sm);">Sign in with a texted code instead</button>
      </form>

      <div id="loginStatus" style="text-align:center; margin-top:var(--spacing-md); display:none;">
        <div class="spinner" style="margin:0 auto;"></div>
        <p style="font-size:var(--font-size-small); color:var(--text-secondary); margin-top:var(--spacing-sm);">
          Connecting to server...
        </p>
      </div>

      <div id="installContainer" class="install-container" style="display:none;">
        <button type="button" id="installBtn" class="install-link">Install this app</button>
        <div id="installHelp" class="install-help" style="display:none;"></div>
      </div>
    </div>

    <p style="margin-top:var(--spacing-lg); font-size:var(--font-size-xs); color:var(--text-muted);">
      Oasis Pool Tile Cleaning & Christmas Lights
    </p>
  </div>

  <script src="js/config.js?v=120"></script>
  <script src="js/odoo-api.js?v=120"></script>
  <script src="js/db.js?v=120"></script>
  <script src="js/auth.js?v=120"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Init DB
      await DB.init();

      // Check for existing valid session
      const restored = await Auth.tryRestore();
      if (restored) {
        window.location.href = 'app.html';
        return;
      }

      // Bind login form
      const form = document.getElementById('loginForm');
      const errorEl = document.getElementById('loginError');
      const statusEl = document.getElementById('loginStatus');
      const loginBtn = document.getElementById('loginBtn');
      const installContainer = document.getElementById('installContainer');
      const installBtn = document.getElementById('installBtn');
      const installHelp = document.getElementById('installHelp');
      let deferredPrompt = null;

      const isStandalone = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      const isIOS = () => {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      };

      const isIpadOS = () =>
        navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;

      const showInstall = () => {
        if (!installContainer || isStandalone()) return;
        installContainer.style.display = 'block';
      };

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstall();
      });

      showInstall();

      installBtn.addEventListener('click', async () => {
        if (!installHelp) return;
        installHelp.style.display = 'none';
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          return;
        }
        if (isIOS() || isIpadOS()) {
          installHelp.textContent = 'On iPhone/iPad: tap Share, then "Add to Home Screen".';
        } else {
          installHelp.textContent = 'Use your browser menu and choose "Install app".';
        }
        installHelp.style.display = 'block';
      });

      // Code by text (the default), or username and password (remembered: the last way used).
      const codeBox = document.getElementById('codeLogin');
      const showWay = (way) => {
        codeBox.style.display = way === 'password' ? 'none' : '';
        form.style.display = way === 'password' ? '' : 'none';
        try { localStorage.setItem('login_way', way); } catch (e) { /* private mode */ }
        errorEl.style.display = 'none';
      };
      let lastWay = 'code';
      try { lastWay = localStorage.getItem('login_way') || 'code'; } catch (e) { /* private mode */ }
      showWay(lastWay);
      document.getElementById('usePasswordBtn').addEventListener('click', () => showWay('password'));
      document.getElementById('useCodeBtn').addEventListener('click', () => showWay('code'));
      const phoneEl = document.getElementById('loginPhone');
      const codeEl = document.getElementById('loginCode');
      const fail = (msg) => { errorEl.textContent = msg; errorEl.style.display = 'block'; };
      const sendCode = async (btn) => {
        errorEl.style.display = 'none';
        if (typeof Auth.sendCode !== 'function') {
          // An older copy of the app's scripts is still saved on this phone: get the new ones.
          fail('Updating the app… one moment.');
          setTimeout(() => window.location.reload(), 800);
          return;
        }
        const phone = phoneEl.value.trim();
        if (phone.replace(/\D/g, '').length < 10) { fail('Enter your 10-digit mobile number'); return; }
        btn.disabled = true;
        const res = await Auth.sendCode(phone);
        btn.disabled = false;
        if (!res.success) { fail(res.error); return; }
        document.getElementById('codeTo').textContent = res.to ? `(to …${res.to})` : '';
        document.getElementById('phoneStep').style.display = 'none';
        document.getElementById('codeStep').style.display = '';
        codeEl.value = '';
        codeEl.focus();
      };
      document.getElementById('sendCodeBtn').addEventListener('click', (e) => sendCode(e.currentTarget));
      document.getElementById('resendCodeBtn').addEventListener('click', (e) => sendCode(e.currentTarget));
      phoneEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCode(document.getElementById('sendCodeBtn')); });
      const codeSignIn = async () => {
        errorEl.style.display = 'none';
        const code = codeEl.value.replace(/\D/g, '');
        if (code.length !== 6) { fail('Enter the 6-digit code from the text'); return; }
        const btn = document.getElementById('codeSignInBtn');
        btn.style.display = 'none';
        statusEl.style.display = 'block';
        const result = await Auth.loginWithCode(phoneEl.value.trim(), code);
        if (result.success) {
          window.location.href = 'app.html';
        } else {
          fail(result.error);
          btn.style.display = 'flex';
          statusEl.style.display = 'none';
        }
      };
      document.getElementById('codeSignInBtn').addEventListener('click', codeSignIn);
      codeEl.addEventListener('input', () => { if (codeEl.value.replace(/\D/g, '').length === 6) codeSignIn(); });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.style.display = 'none';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;

        if (!username || !password) {
          errorEl.textContent = 'Please enter your username and password';
          errorEl.style.display = 'block';
          return;
        }

        // Show loading state
        loginBtn.style.display = 'none';
        statusEl.style.display = 'block';

        const result = await Auth.login(username, password, remember);

        if (result.success) {
          window.location.href = 'app.html';
        } else {
          errorEl.textContent = result.error;
          errorEl.style.display = 'block';
          loginBtn.style.display = 'flex';
          statusEl.style.display = 'none';
        }
      });
    });

    // Register service worker; a new version reloads this page once (so the page and its scripts match).
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController) return;
        let last = 0;
        try { last = parseInt(sessionStorage.getItem('pwa_sw_reload') || '0', 10); } catch (e) { /* ignore */ }
        if (Date.now() - last < 60000) return;
        try { sessionStorage.setItem('pwa_sw_reload', String(Date.now())); } catch (e) { /* ignore */ }
        window.location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(err => {
        console.warn('SW registration failed:', err);
      });
    }
  </script>
</body>
</html>
